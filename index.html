<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0B0B0B">
<meta name="description" content="Duck's personal golf swing analyser. Body tracking in the browser, no upload.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Swing Coach">
<title>Swing Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/archivo-latin-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body data-screen="tab">
<header class="topbar">
  <button type="button" class="icon-btn" id="back" hidden aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg>
  </button>
  <div class="title" id="title">Swing Coach</div>
</header>
<main id="app" class="app" aria-live="polite"></main>
<nav class="tabbar" aria-label="Sections">
  <a href="#home" data-tab="home">Swing</a>
  <a href="#history" data-tab="history">History</a>
  <a href="#settings" data-tab="settings">Settings</a>
</nav>
<noscript><p class="wrap">Swing Coach needs JavaScript to track the body in your clips.</p></noscript>
<script type="module" src="src/app.js"></script>
</body>
</html>
