<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="description" content="Duck's personal golf swing analyser. Body tracking in the browser, no upload.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Swing Coach</title>

<link rel="stylesheet" href="styles.css">

<body data-screen="tab">
<header class="topbar">

  <div class="title" id="title">Swing Coach</div>
</header>
<main id="app" class="app" aria-live="polite"></main>
<nav class="tabbar" aria-label="Sections">
